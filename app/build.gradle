plugins { id 'com.android.application' }
android { namespace 'com.jarvis.ai'; compileSdk 35
 defaultConfig { applicationId 'com.jarvis.ai'; minSdk 26; targetSdk 35; versionCode 1021; versionName '1.021' }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
dependencies {
 implementation 'androidx.core:core:1.17.0'
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'androidx.security:security-crypto:1.1.0-alpha06'
 implementation 'androidx.camera:camera-core:1.5.0'
 implementation 'androidx.camera:camera-camera2:1.5.0'
 implementation 'androidx.camera:camera-lifecycle:1.5.0'
 implementation 'androidx.camera:camera-view:1.5.0'
}
