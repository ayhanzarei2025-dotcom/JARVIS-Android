name: Build JARVIS 2.01 APK
on: { workflow_dispatch: {}, push: { branches: [ main ] }, pull_request: {} }
permissions: { contents: write }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-java@v5
     with: { distribution: temurin, java-version: '17' }
   - uses: android-actions/setup-android@v4
     with: { packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.0.12077973' }
   - uses: gradle/actions/setup-gradle@v6
     with: { gradle-version: '8.7', cache-provider: basic }
   - name: Download compact local model
     run: |
      mkdir -p app/src/main/assets/offline
      curl -L --fail --retry 8 --retry-delay 5 -o app/src/main/assets/offline/jarvis-qwen-q4.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf
      size=$(stat -c%s app/src/main/assets/offline/jarvis-qwen-q4.gguf)
      echo "MODEL bytes: $size"
      test "$size" -ge 350000000
      test "$size" -le 470000000
   - name: Build APK
     run: gradle --no-daemon --stacktrace :app:assembleDebug
   - name: Verify APK size
     run: |
      test -f app/build/outputs/apk/debug/app-debug.apk
      size=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
      echo "FINAL APK bytes: $size"
      test "$size" -ge 400000000
      test "$size" -le 490000000
      cp app/build/outputs/apk/debug/app-debug.apk "JARVIS 2.01.apk"
      sha256sum "JARVIS 2.01.apk" | tee JARVIS-2.01.sha256
   - uses: actions/upload-artifact@v6
     with: { name: JARVIS-2.01-apk, path: 'JARVIS 2.01.apk', retention-days: 30 }
   - uses: actions/upload-artifact@v6
     with: { name: JARVIS-2.01-checksum, path: 'JARVIS-2.01.sha256', retention-days: 30 }
   - name: Publish APK to GitHub Release
     if: github.event_name != 'pull_request'
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      gh release delete v2.01 --yes || true
      git push --delete origin v2.01 || true
      gh release create v2.01 --title "JARVIS 2.01" --notes "JARVIS 2.01 — Iron-Man HUD, multi-brain orchestrator, GPU local LLM, live vision, background voice, Android tools, notification reply approval, memory and safety engine." "JARVIS 2.01.apk" "JARVIS-2.01.sha256"