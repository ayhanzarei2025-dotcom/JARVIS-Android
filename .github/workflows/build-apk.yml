name: Build JARVIS 2.01 APK
on: { workflow_dispatch: {}, push: { branches: [ main ] }, pull_request: {} }
permissions: { contents: write }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-java@v5
     with: { distribution: temurin, java-version: '17' }
   - uses: android-actions/setup-android@v4
     with: { packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.0.12077973' }
   - uses: gradle/actions/setup-gradle@v6
     with: { gradle-version: '8.7', cache-provider: basic }
   - name: Verify no bundled model
     run: |
      if find app/src/main/assets -type f -name '*.gguf' 2>/dev/null | grep -q .; then echo 'ERROR: GGUF model must not be bundled in APK'; exit 1; fi
   - name: Build APK
     run: gradle --no-daemon --stacktrace :app:assembleDebug
   - name: Verify APK is under 100 MB
     run: |
      test -f app/build/outputs/apk/debug/app-debug.apk
      size=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
      echo "FINAL APK bytes: $size"
      test "$size" -lt 100000000
      cp app/build/outputs/apk/debug/app-debug.apk "JARVIS 2.01.apk"
      sha256sum "JARVIS 2.01.apk" | tee JARVIS-2.01-qwen3.sha256
   - uses: actions/upload-artifact@v6
     with: { name: JARVIS-2.01-qwen3-apk, path: 'JARVIS 2.01.apk', retention-days: 30 }
   - uses: actions/upload-artifact@v6
     with: { name: JARVIS-2.01-qwen3-checksum, path: 'JARVIS-2.01-qwen3.sha256', retention-days: 30 }
   - name: Publish APK to GitHub Release
     if: github.event_name != 'pull_request'
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      gh release delete v2.01-qwen3 --yes || true
      git push --delete origin v2.01-qwen3 || true
      gh release create v2.01-qwen3 --title "JARVIS 2.01" --notes "JARVIS 2.01 — Qwen3-4B Q4_K_M local brain downloaded on first use; APK remains below 100MB while the stronger local model stays outside the APK. Multi-brain, live vision, voice, tools, memory and safety retained." "JARVIS 2.01.apk" "JARVIS-2.01-qwen3.sha256"