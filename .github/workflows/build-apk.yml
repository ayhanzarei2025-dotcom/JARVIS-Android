name: Build JARVIS 1.021 APK
on: { workflow_dispatch: {}, push: { branches: [ main ] }, pull_request: {} }
permissions: { contents: read }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-java@v5
     with: { distribution: temurin, java-version: '17' }
   - uses: android-actions/setup-android@v4
     with: { packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.0.12077973' }
   - uses: gradle/actions/setup-gradle@v6
     with: { gradle-version: '8.7', cache-provider: basic }
   - name: Download real offline Persian-capable model
     run: |
      mkdir -p app/src/main/assets/offline
      curl -L --fail --retry 7 --retry-delay 5 -o app/src/main/assets/offline/jarvis-qwen-q3km.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q3_k_m.gguf
      ls -lh app/src/main/assets/offline/jarvis-qwen-q3km.gguf
      size=$(stat -c%s app/src/main/assets/offline/jarvis-qwen-q3km.gguf)
      test "$size" -ge 700000000
   - name: Build APK
     run: gradle --no-daemon --stacktrace :app:assembleDebug
   - name: Verify APK
     run: |
      test -f app/build/outputs/apk/debug/app-debug.apk
      size=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
      echo "FINAL APK bytes: $size"
      test "$size" -ge 500000000
      cp app/build/outputs/apk/debug/app-debug.apk "JARVIS 1.021.apk"
      split -b 450M "JARVIS 1.021.apk" "JARVIS-1.021-part-"
      ls -lh JARVIS-1.021-part-*
   - uses: actions/upload-artifact@v6
     with: { name: JARVIS-1.021-part-1, path: 'JARVIS-1.021-part-aa', retention-days: 14 }
   - uses: actions/upload-artifact@v6
     with: { name: JARVIS-1.021-part-2, path: 'JARVIS-1.021-part-ab', retention-days: 14 }
   - uses: actions/upload-artifact@v6
     with: { name: JARVIS-1.021-part-3, path: 'JARVIS-1.021-part-ac', retention-days: 14 }